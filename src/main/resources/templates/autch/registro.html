<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Medina Fragrances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body class="auth-body">

    <main class="auth-shell auth-shell-register">
        <section class="auth-visual">
            <a class="auth-back" th:href="@{/}">
                <i class="bi bi-arrow-left"></i>
                <span>Volver a la tienda</span>
            </a>
            <div class="auth-visual-content">
                <span class="auth-kicker">Cuenta Medina</span>
                <h1>Crea tu perfil y descubre fragancias con caracter.</h1>
                <p>Guarda tus datos para comprar mas rapido, recibir novedades y explorar decants exclusivos.</p>
                <div class="auth-trust">
                    <span><i class="bi bi-stars"></i> Seleccion premium</span>
                    <span><i class="bi bi-bag-heart"></i> Compra segura</span>
                </div>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-card auth-card-register">
                <div class="auth-header">
                    <a th:href="@{/}" class="auth-logo">MEDINA</a>
                    <p>Crear cuenta nueva</p>
                </div>

                <form th:action="@{/auth/registrar}" th:object="${usuario}" method="post" class="auth-form">
                    <div class="auth-grid">
                        <div class="auth-field auth-field-wide">
                            <label for="nombre">Nombre completo</label>
                            <div class="auth-input">
                                <i class="bi bi-person"></i>
                                <input id="nombre" type="text" th:field="*{nombre}"
                                       placeholder="Ej. Marco Medina">
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('nombre')}" th:errors="*{nombre}"></div>
                        </div>

                        <div class="auth-field">
                            <label for="dni">DNI</label>
                            <div class="auth-input">
                                <i class="bi bi-credit-card-2-front"></i>
                                <input id="dni" type="text" th:field="*{dni}"
                                       placeholder="12345678" maxlength="8">
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('dni')}" th:errors="*{dni}"></div>
                            <div class="auth-error" th:if="${errorDni}" th:text="${errorDni}"></div>
                        </div>

                        <div class="auth-field">
                            <label for="telefono">Telefono</label>
                            <div class="auth-input">
                                <i class="bi bi-phone"></i>
                                <input id="telefono" type="text" th:field="*{telefono}"
                                       placeholder="987654321" maxlength="9">
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('telefono')}" th:errors="*{telefono}"></div>
                        </div>

                        <div class="auth-field auth-field-wide">
                            <label for="email">Correo electronico</label>
                            <div class="auth-input">
                                <i class="bi bi-envelope"></i>
                                <input id="email" type="email" th:field="*{email}"
                                       placeholder="correo@ejemplo.com">
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            <div class="auth-error" th:if="${errorEmail}" th:text="${errorEmail}"></div>
                        </div>

                        <div class="auth-field auth-field-wide">
                            <label for="direccion">Direccion</label>
                            <div class="auth-input">
                                <i class="bi bi-geo-alt"></i>
                                <input id="direccion" type="text" th:field="*{direccion}"
                                       placeholder="Av. ejemplo 123, Lima">
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('direccion')}" th:errors="*{direccion}"></div>
                        </div>

                        <div class="auth-field auth-field-wide">
                            <label for="password">Contrasena</label>
                            <div class="auth-input">
                                <i class="bi bi-lock"></i>
                                <input id="password" type="password" th:field="*{password}"
                                       placeholder="Minimo 6 caracteres">
                                <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Mostrar contrasena">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                            <div class="auth-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                        </div>
                    </div>

                    <button type="submit" class="auth-submit">
                        Registrarse
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Ya tienes una cuenta?</p>
                    <a th:href="@{/login}">Iniciar sesion</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-password-toggle]').forEach((button) => {
            button.addEventListener('click', () => {
                const input = button.parentElement.querySelector('input');
                const icon = button.querySelector('i');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        });
    </script>
</body>
</html>
