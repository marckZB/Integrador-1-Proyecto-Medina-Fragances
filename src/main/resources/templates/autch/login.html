<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesion - Medina Fragrances</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/Styles.css}">
</head>
<body class="auth-body">

    <main class="auth-shell auth-shell-login">
        <section class="auth-visual">
            <a class="auth-back" th:href="@{/}">
                <i class="bi bi-arrow-left"></i>
                <span>Volver a la tienda</span>
            </a>
            <div class="auth-visual-content">
                <span class="auth-kicker">Medina Fragrances</span>
                <h1>Lujo autentico, reservado para tu esencia.</h1>
                <p>Ingresa a tu cuenta para continuar con tus favoritos, decants y pedidos.</p>
                <div class="auth-trust">
                    <span><i class="bi bi-shield-check"></i> 100% autentico</span>
                    <span><i class="bi bi-truck"></i> Envio en Lima</span>
                </div>
            </div>
        </section>

        <section class="auth-panel">
            <div class="auth-card">
                <div class="auth-header">
                    <a th:href="@{/}" class="auth-logo">MEDINA</a>
                    <p>Iniciar sesion</p>
                </div>

                <div th:if="${mensajeExito}"
                     class="alert auth-alert auth-alert-success" th:text="${mensajeExito}"></div>

                <div th:if="${errorLogin}"
                     class="alert auth-alert auth-alert-danger" th:text="${errorLogin}"></div>

                <form th:action="@{/auth/ingresar}" th:object="${usuario}" method="post" class="auth-form">
                    <input type="hidden" name="redirect" th:value="${redirectUrl != null ? redirectUrl : '/'}">

                    <div class="auth-field">
                        <label for="email">Correo electronico</label>
                        <div class="auth-input">
                            <i class="bi bi-envelope"></i>
                            <input id="email" type="email" th:field="*{email}"
                                   placeholder="usuario@email.com" required>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label for="password">Contrasena</label>
                        <div class="auth-input">
                            <i class="bi bi-lock"></i>
                            <input id="password" type="password" th:field="*{password}"
                                   placeholder="Ingresa tu contrasena" required>
                            <button type="button" class="auth-password-toggle" data-password-toggle aria-label="Mostrar contrasena">
                                <i class="bi bi-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div class="auth-options">
                        <label class="auth-check">
                            <input type="checkbox">
                            <span>Recordarme</span>
                        </label>
                        <a href="/contacto">Necesito ayuda</a>
                    </div>

                    <button type="submit" class="auth-submit">
                        Entrar
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </form>

                <div class="auth-switch">
                    <p>Nuevo en Medina Fragrances?</p>
                    <a th:href="@{/registro}">Crear una cuenta</a>
                </div>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('[data-password-toggle]').forEach((button) => {
            button.addEventListener('click', () => {
                const input = button.parentElement.querySelector('input');
                const icon = button.querySelector('i');
                const isPassword = input.type === 'password';
                input.type = isPassword ? 'text' : 'password';
                icon.className = isPassword ? 'bi bi-eye-slash' : 'bi bi-eye';
            });
        });
    </script>
</body>
</html>
